<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow Icon Generator</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #0b0f19;
            margin-bottom: 10px;
        }

        .instructions {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0b0f19;
        }

        button {
            background: #0b0f19;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 10px 10px 0;
            font-weight: 500;
        }

        button:hover {
            background: #1a2332;
        }

        button:active {
            transform: scale(0.98);
        }

        .preview {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
            display: none;
        }

        .status.show {
            display: block;
        }
    </style>
</head>

<body>
    <h1>🎨 Taskflow PWA Icon Generator</h1>

    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Click each button below to generate and download the icons</li>
            <li>Save both files to: <code>c:\Users\davoj\TODO\public\icons\</code></li>
            <li>Replace the existing files</li>
            <li>Restart your dev server</li>
        </ol>
    </div>

    <button onclick="generate192()">📥 Download icon-192.png</button>
    <button onclick="generate512()">📥 Download icon-512.png</button>
    <button onclick="generateBoth()">📥 Download Both Icons</button>

    <div class="preview" id="preview"></div>
    <div class="status" id="status"></div>

    <script>
        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), 3000);
        }

        function generate192() {
            const canvas = document.createElement('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, 192, 192);

            // Draw a checkmark
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(50, 96);
            ctx.lineTo(80, 126);
            ctx.lineTo(142, 64);
            ctx.stroke();

            // Show preview
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            canvas.style.width = '192px';
            canvas.style.height = '192px';
            preview.appendChild(canvas.cloneNode(true));

            // Download
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'icon-192.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('✅ icon-192.png downloaded!');
            });
        }

        function generate512() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, 512, 512);

            // Draw a checkmark
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 42;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(133, 256);
            ctx.lineTo(213, 336);
            ctx.lineTo(379, 170);
            ctx.stroke();

            // Show preview
            const preview = document.getElementById('preview');
            if (preview.children.length === 0) {
                preview.innerHTML = '';
            }
            const previewCanvas = canvas.cloneNode(true);
            previewCanvas.style.width = '192px';
            previewCanvas.style.height = '192px';
            preview.appendChild(previewCanvas);

            // Download
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'icon-512.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('✅ icon-512.png downloaded!');
            });
        }

        function generateBoth() {
            generate192();
            setTimeout(() => generate512(), 500);
        }
    </script>
</body>

</html>
